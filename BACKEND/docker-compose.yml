name: hospital-management

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_backend
    ports:
      - "1002:1002"
    # Uses the external MongoDB Atlas database via ATLAS_URI in .env.
    # No local MongoDB container is created (keeps server storage usage low).
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - hospital_network

networks:
  hospital_network:
    driver: bridge
