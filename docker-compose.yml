version: '3.8'

services:
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: hospital_backend
    ports:
      - "1002:1002"
    env_file:
      - ./BACKEND/.env
    restart: unless-stopped
    networks:
      - hospital_network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: hospital_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hospital_network
    restart: unless-stopped

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        # Use the production API URL during the Docker build
        - REACT_APP_API_URL=https://api-hmp.mirzashafi.com
    container_name: hospital_frontend
    ports:
      - "1001:80"
    restart: unless-stopped
    networks:
      - hospital_network
    depends_on:
      - backend

networks:
  hospital_network:
    driver: bridge

volumes:
  mongo_data:
